# dsh-web-relay — 8443 网关 jail。安装到 /etc/fail2ban/jail.d/。
#
# 本文件整体由插件拥有：写入前检查首行的 dsh-web-relay 标记，标记不在就停下，
# 不覆盖用户自己写的同名文件。
#
# @@GATEWAY_PORT@@ 由引导按 `gateway.port` 替换；logpath 与 Caddyfile 里的
# output file 出自同一份模板，两者必须一致。
#
# 出口地址占位符由引导从 sshd 交给登录 shell 的 `SSH_CONNECTION` 现取后填进来，
# 也就是内网主机在这一跳上对外的地址。它不是装饰：部署第 13 步的公网自检本身会发出
# 不带网关口令的请求，被 Caddy 记成一次 `basic_auth` 失败，反复重启 DSH 就可能把
# 操作者自己封掉（症状是公网端口直接 `Connection refused`，而 Caddy 与隧道都正常）。
# 取不到出口地址时它被替换成空串，jail 退回默认的封禁规则。

[DEFAULTS]
# 单用户场景下自己被封的概率很低，而攻击者会被指数推开。
bantime.increment = true

[caddy-dsh-relay]
enabled  = true
port     = @@GATEWAY_PORT@@
filter   = caddy-dsh-relay
logpath  = /var/log/caddy/dsh-relay-access.log
ignoreip = 127.0.0.1/8 @@HOME_EGRESS_IP@@
maxretry = 5
findtime = 600
bantime  = 3600
