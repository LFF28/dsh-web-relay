# dsh-web-relay — 8443 网关口令爆破防护。
#
# 日志是 Caddy 的 JSON 单行访问日志，`logger` 前缀匹配 http.log.access.*，
# 一行匹配即可；<HOST> 由 fail2ban 从 remote_ip 取值。
#
# 只统计**网关口令**失败，也就是带 `Www-Authenticate` 的那一类 401。DSH 自己
# 也会返回 401（浏览器还没有 DSH 会话时的正常状态，`user_id` 已经证明口令是对的），
# 把它一起算进去会让正常使用的自己人先被封掉。爆破信号只存在于前者。
[Definition]
failregex = ^.*"logger":"http\.log.*"remote_ip":"<HOST>".*"status":401.*"Www-Authenticate".*$
ignoreregex =
