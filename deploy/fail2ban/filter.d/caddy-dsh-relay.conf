# dsh-web-relay — 8443 网关口令爆破防护。
#
# 日志是 Caddy 的 JSON 单行访问日志，`logger` 前缀匹配 http.log.access.*，
# 一行匹配即可；<HOST> 由 fail2ban 从 remote_ip 取值。
#
# 规则同时捕获两种 401：Caddy 的 basic_auth 失败，以及 DSH 自己返回的 401
# （后者通常意味着隧道通了但认证有问题，被一起封掉是可接受的副作用）。
[Definition]
failregex = ^.*"logger":"http\.log.*"remote_ip":"<HOST>".*"status":401.*$
ignoreregex =
